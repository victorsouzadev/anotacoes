# Base do compose. Não expõe porta nenhuma por si só — use um dos overrides:
#   docker compose -f docker-compose.yml -f docker-compose.local.yml up --build   (teste local, :8080)
#   docker compose -f docker-compose.yml -f docker-compose.vps.yml up -d --build  (produção VPS, :8090)
services:
  api:
    build: ./backend
    restart: unless-stopped
    env_file: .env
    environment:
      - ConnectionStrings__Db=Data Source=/data/db/notas.db
      - OpenRouter__ApiKey=${OPENROUTER_API_KEY:-}
      - Anthropic__ApiKey=${ANTHROPIC_API_KEY:-}
      # Ampliação de foto por IA no Editor de Imagens. Sem esta chave o recurso
      # fica desligado e o botão nem aparece.
      - Upscale__ApiKey=${REPLICATE_API_TOKEN:-}
      - Upscale__Model=${UPSCALE_MODEL:-nightmareai/real-esrgan}
      # Importação de transações da AUVP Financeiro (Finanças). A chave é de
      # cada usuário, cadastrada na tela.
      - Auvp__BaseUrl=${AUVP_BASE_URL:-https://financas-api.auvp.com.br}
      - Auvp__HeaderChave=${AUVP_HEADER_CHAVE:-Authorization}
      - Auvp__PrefixoChave=${AUVP_PREFIXO_CHAVE:-Bearer }
      - Auvp__IntervaloSincronizacaoHoras=${AUVP_INTERVALO_HORAS:-6}
      # Proxy HTTP só para a AUVP, se o firewall dela barrar o IP da VPS
      # (ex.: http://usuario:senha@host:porta). Vazio = conexão direta.
      - Auvp__Proxy=${AUVP_PROXY:-}
      - Llm__Provider=${LLM_PROVIDER:-}
      # Commit que originou a imagem, devolvido pelo /api/health. Sem isso não há
      # como saber qual build está de pé sem entrar na VPS — e um deploy verde
      # não prova, por si só, que o container foi substituído.
      - App__Versao=${APP_VERSAO:-desconhecida}
      # Ferramenta "Publicar" (docs/poc-multi-app/DISCOVERY.md). Sem PUBLICADORES
      # ninguém publica; sem DEPLOYER_TOKEN só sites estáticos funcionam.
      - Sites__Raiz=/data/sites
      - Sites__Publicadores=${PUBLICADORES:-}
      - Sites__DeployerToken=${DEPLOYER_TOKEN:-}
      - Sites__Dominio=${SITES_DOMINIO:-191-252-177-244.sslip.io}
      - Sites__Porta=${SITES_PORTA:-8090}
      # Banco Postgres por site (serviço "postgres" abaixo). Sem senha, o recurso fica desligado.
      - Sites__PostgresSenha=${POSTGRES_SENHA:-}
      # MCPs dos apps (/api/mcp/tarefas, /financas, /criativo) para o Segundo Cérebro e o Claude:
      # o token é gerado na tela do Cérebro, que grava só o hash e o e-mail do dono neste arquivo.
      - Mcp__TokenFile=/access/apps-token.json
      # Ferramenta "Anotação" (relatos do mestrado). Só liga com o lote em data/anotacao
      # (enviado pelo llm-ner-pipeline) e só para os e-mails de ANOTACAO_USUARIOS.
      - Anotacao__RunDir=/anotacao
      - Anotacao__Usuarios=${ANOTACAO_USUARIOS:-}
    volumes:
      - ./data/db:/data/db
      - ./data/sites:/data/sites
      - ./data/anotacao:/anotacao
      - ./data/cerebro/hub/access:/access:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  caddy:
    build:
      context: .
      dockerfile: caddy/Dockerfile
    restart: unless-stopped
    volumes:
      - caddy_data:/data
      - caddy_config:/config
      # instalador do Editor de Imagens pra Windows (fora da imagem; ver Caddyfile)
      - ./downloads:/srv-downloads/downloads:ro
      # sites publicados (só leitura: quem escreve é a API)
      - ./data/sites:/srv-sites:ro
    environment:
      - SITES_DOMINIO=${SITES_DOMINIO:-191-252-177-244.sslip.io}
    # "sites" é a rede dos containers dos apps publicados: o Caddy entra nela para
    # alcançar site-<slug>:8080; a API e o deployer não.
    networks:
      - default
      - sites
    depends_on:
      - api

  # Único serviço com acesso ao Docker: cria/remove os containers site-<slug> a pedido
  # da API (token compartilhado). Fica atrás do profile "publicar" para não subir em
  # quem não usa a ferramenta — ligue com COMPOSE_PROFILES=publicar no .env.
  deployer:
    build: ./deployer
    profiles: ["publicar"]
    restart: unless-stopped
    environment:
      - DEPLOYER_TOKEN=${DEPLOYER_TOKEN:-}
      # Caminho de data/sites NO HOST: é o que o daemon do Docker monta nos apps.
      - SITES_HOST_DIR=${SITES_HOST_DIR:-/opt/notas-vps/data/sites}
      - DEPLOYER_REDE=notas-sites
      # pg_dump/pg_restore antes de cada deploy rodam dentro deste container (docker exec).
      - DEPLOYER_POSTGRES=notas-postgres
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

  # Postgres compartilhado dos sites publicados: cada site ganha um banco e um usuário
  # próprios (site_<slug>), criados pela API. Os apps o acessam como postgres:5432 pela
  # rede "sites"; a API, pela rede padrão. Não publica porta no host.
  postgres:
    image: postgres:17-alpine
    # Nome fixo: é por ele que o deployer faz o docker exec do pg_dump.
    container_name: notas-postgres
    profiles: ["publicar"]
    restart: unless-stopped
    environment:
      - POSTGRES_PASSWORD=${POSTGRES_SENHA:-}
    # Enxuto para a VPS de 1.9 GiB: poucos buffers e conexões (cada app tem teto de 10).
    command:
      - postgres
      - -c
      - shared_buffers=32MB
      - -c
      - max_connections=60
      - -c
      - work_mem=2MB
      - -c
      - maintenance_work_mem=16MB
      - -c
      - effective_cache_size=128MB
    mem_limit: 256m
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - default
      - sites

  # Ferramenta "Segundo Cérebro" (cerebro/README.md): vault do Obsidian na VPS, com
  # captura por API, Inbox classificada pelo Claude e MCP. O Caddy publica a API em
  # /cerebro/* e o WebDAV do Obsidian em /dav/*. Atrás do profile "cerebro": ligue
  # com COMPOSE_PROFILES=...,cerebro no .env. Os .md do vault são a fonte da verdade;
  # data/cerebro/hub (busca, fila, git) é derivado e pode ser recriado.
  cerebro:
    build: ./cerebro
    profiles: ["cerebro"]
    restart: unless-stopped
    user: "${CEREBRO_PUID:-1000}:${CEREBRO_PGID:-1000}"
    environment:
      - Hub__VaultPath=/data/webdav/${CEREBRO_VAULT:-Cerebro}
      - Hub__DataPath=/data/hub
      - Hub__TimeZone=${TZ:-America/Belem}
      - Hub__McpToken=${CEREBRO_MCP_TOKEN:-}
      - Hub__ApiKeys__celular=${CEREBRO_API_KEY_CELULAR:-}
      - Hub__ApiKeys__whatsapp=${CEREBRO_API_KEY_WHATSAPP:-}
      - Hub__ApiKeys__navegador=${CEREBRO_API_KEY_NAVEGADOR:-}
      - Hub__Anthropic__ApiKey=${ANTHROPIC_API_KEY:-}
      - Hub__Anthropic__Model=${CEREBRO_MODELO:-claude-haiku-5-5}
      # Classificação pela OpenRouter: a mesma chave das Finanças. A tela do Cérebro pode trocar
      # provedor, modelo e chave (aba Configurações), sem mexer no .env.
      - Hub__OpenRouter__ApiKey=${OPENROUTER_API_KEY:-}
      - Hub__Transcription__ApiKey=${CEREBRO_OPENAI_API_KEY:-}
      - Hub__AutoMoveLowRisk=${CEREBRO_AUTO_MOVER:-false}
      # App Casa (serviço à parte): o mesmo MCP_TOKEN do casa-api. Vazio = a Casa fica fora da rotina dos apps.
      - Hub__Casa__McpUrl=${CASA_MCP_URL:-https://casa.vsitefy.com.br/mcp}
      - Hub__Casa__McpToken=${CASA_MCP_TOKEN:-}
      # Login único do hub: o mesmo JWT_SECRET do serviço "api", e só estes e-mails.
      - Hub__Web__JwtSecret=${JWT_SECRET:-}
      - Hub__Web__Usuarios=${CEREBRO_USUARIOS:-}
      # Login do WebDAV inicial. A tela (aba Conectar) pode trocar; aí este deixa de valer.
      - Hub__WebdavUser=${CEREBRO_WEBDAV_USER:-}
      - Hub__WebdavPass=${CEREBRO_WEBDAV_PASS:-}
    volumes:
      - ./data/cerebro/webdav:/data/webdav
      - ./data/cerebro/hub:/data/hub
    mem_limit: 256m

  # WebDAV que o plugin Remotely Save do Obsidian usa para sincronizar o vault.
  # O Remotely Save grava em /dav/<CEREBRO_VAULT>, que é a pasta que o "cerebro" lê.
  # Sem senha própria: o Caddy confere o login no "cerebro" (forward_auth) antes de repassar,
  # para a senha poder ser trocada pela tela. Não publica porta: só o Caddy o alcança.
  cerebro-webdav:
    image: rclone/rclone:1.71.1
    profiles: ["cerebro"]
    restart: unless-stopped
    user: "${CEREBRO_PUID:-1000}:${CEREBRO_PGID:-1000}"
    environment:
      - RCLONE_CONFIG=/tmp/rclone.conf
    command:
      - serve
      - webdav
      - /data
      - --addr=:8080
      - --baseurl=/dav
      # O "cerebro" também escreve no disco: sem isso o WebDAV demoraria minutos para ver as mudanças.
      - --dir-cache-time=2s
      - --poll-interval=0
    volumes:
      - ./data/cerebro/webdav:/data
    mem_limit: 128m

  # MCP de operação da VPS (ops/README.md): shell de root no HOST via nsenter, logs e
  # restart de qualquer container, leitura e escrita de arquivos. Quem tem o token
  # controla a VPS inteira. Atrás do profile "ops" e de HTTPS (Caddy, /ops/*).
  ops:
    build: ./ops
    profiles: ["ops"]
    restart: unless-stopped
    # pid: host + privileged: o nsenter entra nos namespaces do PID 1 do host.
    pid: host
    privileged: true
    environment:
      - Ops__Token=${OPS_MCP_TOKEN:-}
      - Ops__Mode=nsenter
      - Ops__DataPath=/data
      # Não logar a URL de cada requisição: o token do MCP vai na query (?key=).
      - Logging__LogLevel__Microsoft.AspNetCore.Hosting.Diagnostics=Warning
    volumes:
      - ./data/ops:/data
      # Hash do token gerado na tela do Segundo Cérebro (substitui o OPS_MCP_TOKEN quando existe).
      - ./data/cerebro/hub/access:/access:ro
    mem_limit: 128m

networks:
  sites:
    name: notas-sites

volumes:
  caddy_data:
  caddy_config:
