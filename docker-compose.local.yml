# Teste local do compose:
#   docker compose -f docker-compose.yml -f docker-compose.local.yml up --build
# Acesse http://localhost:8080
# Sites publicados: http://<slug>.127-0-0-1.sslip.io:8080 (127-0-0-1.sslip.io resolve para 127.0.0.1)
services:
  caddy:
    ports:
      - "8080:8080"
    environment:
      - SITES_DOMINIO=127-0-0-1.sslip.io

  api:
    environment:
      - Sites__Dominio=127-0-0-1.sslip.io
      - Sites__Porta=8080

  deployer:
    environment:
      - SITES_HOST_DIR=${PWD}/data/sites
