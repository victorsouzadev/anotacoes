name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches-ignore: [main]

jobs:
  backend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    # Postgres real para os testes do "Publicar" (banco/usuário por site, isolamento).
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_POSTGRES_ADMIN: Host=localhost;Port=5432;Username=postgres;Password=postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x
      - run: dotnet restore
      - run: dotnet build --no-restore --configuration Release
      - run: dotnet test --no-build --configuration Release
      # A imagem de produção já roda com ICU, mas a suíte também precisa passar
      # sem ele: foi um GetCultureInfo("pt-BR") em campo static que derrubou o
      # dashboard de finanças com 500 quando o container subiu em modo
      # globalization-invariant.
      - name: Testes em modo globalization-invariant
        run: dotnet test --no-build --configuration Release
        env:
          DOTNET_SYSTEM_GLOBALIZATION_INVARIANT: 1

  # Scripts do host (backup das specs 025 e 036): shellcheck e testes sem rede.
  scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get install -y -qq jq shellcheck sqlite3
      - run: shellcheck -x scripts/*.sh scripts/tests/*.sh
      - run: sh scripts/tests/backup.test.sh
      - run: sh scripts/carga-sqlite.sh "" 100

  # Pacotes dos plug-ins (spec 032): SDK .NET e @grafite/ui.
  pacotes:
    runs-on: ubuntu-latest
    # Spec 038: o Esquema do SDK também roda contra um Postgres de verdade.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: teste
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      HUB_PG_TESTE: Host=localhost;Port=5432;Username=postgres;Password=teste;Database=postgres
    defaults:
      run:
        working-directory: pacotes
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x
      - run: dotnet test Hub.Plugin.Sdk.Tests --configuration Release
      - name: SDK em modo globalization-invariant
        run: dotnet test Hub.Plugin.Sdk.Tests --configuration Release
        env:
          DOTNET_SYSTEM_GLOBALIZATION_INVARIANT: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci && npm test
        working-directory: pacotes/grafite-ui

  # Ferramenta "Publicar": o serviço que cria os containers dos apps.
  deployer-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: deployer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x
      - run: dotnet build Notas.Deployer.sln --configuration Release
      - run: dotnet test Notas.Deployer.sln --no-build --configuration Release

  # Ferramenta "Segundo Cérebro": serviço próprio em .NET 10 (o backend segue no 9).
  cerebro-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cerebro
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet build segundo-cerebro.slnx --configuration Release
      - run: dotnet test segundo-cerebro.slnx --no-build --configuration Release

  # MCP de operação da VPS (ops/).
  ops-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ops
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet build ops.slnx --configuration Release
      - run: dotnet test ops.slnx --no-build --configuration Release

  frontend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx ng build --configuration production
      - run: npx ng test

  mcp-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mcp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mcp/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm test
