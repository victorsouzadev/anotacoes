name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches-ignore: [main]

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      mobile: ${{ steps.filter.outputs.mobile }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            mobile:
              - 'mobile/**'

  # Ponte em JavaScript dos craft apps do Estúdio (estudio/crafts/ponte-hub.js) num Chromium de verdade
  # e o adaptador do MCP remoto deles.
  ponte-crafts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Ponte dos craft apps
        working-directory: estudio/crafts
        run: |
          npm i --no-save --no-package-lock playwright@1.63.0
          npx playwright install --with-deps chromium
          node teste/ponte.test.mjs
      # Adaptador do MCP remoto dos craft apps (stdio da CLI ↔ HTTP), com uma CLI de mentira.
      - name: MCP remoto dos craft apps
        run: node --test crafts-mcp/teste/servidor.test.mjs

  backend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    # Postgres real para os testes do "Publicar" (banco/usuário por site, isolamento).
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_POSTGRES_ADMIN: Host=localhost;Port=5432;Username=postgres;Password=postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x
      - run: dotnet restore
      - run: dotnet build --no-restore --configuration Release
      - run: dotnet test --no-build --configuration Release
      # A imagem de produção já roda com ICU, mas a suíte também precisa passar
      # sem ele: foi um GetCultureInfo("pt-BR") em campo static que derrubou o
      # dashboard de finanças com 500 quando o container subiu em modo
      # globalization-invariant.
      - name: Testes em modo globalization-invariant
        run: dotnet test --no-build --configuration Release
        env:
          DOTNET_SYSTEM_GLOBALIZATION_INVARIANT: 1

  # Ferramenta "Publicar": o serviço que cria os containers dos apps.
  deployer-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: deployer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x
      - run: dotnet build Notas.Deployer.sln --configuration Release
      - run: dotnet test Notas.Deployer.sln --no-build --configuration Release

  # O programa desktop é WPF (só roda no Windows), mas compila no Linux: pega
  # erro de código aqui, sem esperar o instalador (workflow Desktop).
  desktop-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x
      - run: dotnet build EditorImagens.sln --configuration Release
      - run: dotnet test tests/EditorImagens.Ia.Tests --no-build --configuration Release

  # Ferramenta "Segundo Cérebro": serviço próprio em .NET 10 (o backend segue no 9).
  cerebro-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cerebro
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet build segundo-cerebro.slnx --configuration Release
      - run: dotnet test segundo-cerebro.slnx --no-build --configuration Release

  # MCP de operação da VPS (ops/).
  ops-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ops
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet build ops.slnx --configuration Release
      - run: dotnet test ops.slnx --no-build --configuration Release

  frontend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx ng build --configuration production
      - run: npx ng test

  mobile-build:
    needs: changes
    if: needs.changes.outputs.mobile == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      # Sem "packages", a action pede o pacote "tools", que não existe mais no SDK atual, e falha.
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'
      - run: ./gradlew assembleDebug testDebugUnitTest --no-daemon

  mcp-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mcp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mcp/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm test
