name: Deploy

on:
  push:
    branches: [main]

jobs:
  build-backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x
      - run: dotnet restore
      - run: dotnet build --no-restore --configuration Release

  build-frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx ng build --configuration production

  build-mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - run: yes | sdkmanager "platforms;android-34" "build-tools;34.0.0" > /dev/null
      - run: ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: organizador-apk
          path: mobile/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  deploy:
    needs: [build-backend, build-frontend, build-mobile]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Baixa o APK do app Android buildado no job anterior
        uses: actions/download-artifact@v4
        with:
          name: organizador-apk
          path: /tmp/apk

      - name: Coloca o APK nos assets estáticos do frontend (baixável em /downloads/organizador.apk)
        run: |
          mkdir -p frontend/public/downloads
          cp /tmp/apk/app-debug.apk frontend/public/downloads/organizador.apk

      - name: Empacota backend + frontend + configs de deploy
        run: |
          tar -czf deploy.tar.gz \
            --exclude=backend/bin --exclude=backend/obj \
            --exclude=frontend/node_modules --exclude=frontend/dist --exclude=frontend/.angular \
            backend frontend docker-compose.yml docker-compose.vps.yml caddy

      - name: Envia pacote para a VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: deploy.tar.gz
          target: /opt/notas-vps
          overwrite: true

      - name: Extrai e sobe os containers (build sequencial, mitigando OOM em 1.9 GiB de RAM)
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            cd /opt/notas-vps
            tar -xzf deploy.tar.gz
            rm deploy.tar.gz
            mkdir -p data/db
            docker stop hermes || true
            docker compose -f docker-compose.yml -f docker-compose.vps.yml build api
            docker compose -f docker-compose.yml -f docker-compose.vps.yml build caddy
            docker compose -f docker-compose.yml -f docker-compose.vps.yml up -d
            docker start hermes || true
            docker image prune -f

      - name: Verifica saúde da API
        run: |
          sleep 5
          corpo=$(curl -sf http://${{ secrets.VPS_HOST }}:8090/api/health)
          echo "$corpo"
          # Sem ICU o container sobe e responde /api/health normalmente, mas
          # qualquer endpoint que formate em pt-BR devolve 500 — foi assim que
          # o dashboard de finanças quebrou sem o deploy acusar nada.
          echo "$corpo" | grep -q '"icu":"ok"' || {
            echo "::error::A imagem subiu sem ICU (modo globalization-invariant)."
            exit 1
          }
