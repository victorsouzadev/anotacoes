name: Deploy

on:
  push:
    branches: [main]

# Um deploy por vez: dois merges seguidos rodavam "up -d" ao mesmo tempo na VPS e
# o segundo falhava com conflito de nome de container. O próximo espera na fila
# (sem cancelar o que está rodando, para não interromper um deploy no meio).
concurrency:
  group: deploy-vps
  cancel-in-progress: false

jobs:
  build-backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x
      - run: dotnet restore
      - run: dotnet build --no-restore --configuration Release

  build-frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx ng build --configuration production

  # build-mobile temporariamente desativado — reative removendo os comentários abaixo
  # e devolvendo "build-mobile" pro needs do job deploy (e os dois steps do APK).
  # build-mobile:
  #   runs-on: ubuntu-latest
  #   defaults:
  #     run:
  #       working-directory: mobile
  #   steps:
  #     - uses: actions/checkout@v4
  #     - uses: actions/setup-java@v4
  #       with:
  #         distribution: temurin
  #         java-version: '17'
  #     - uses: android-actions/setup-android@v3
  #     - run: yes | sdkmanager "platforms;android-34" "build-tools;34.0.0" > /dev/null
  #     - run: ./gradlew assembleDebug --no-daemon
  #     - uses: actions/upload-artifact@v4
  #       with:
  #         name: organizador-apk
  #         path: mobile/app/build/outputs/apk/debug/app-debug.apk
  #         if-no-files-found: error

  deploy:
    needs: [build-backend, build-frontend]  # build-mobile removido temporariamente, ver acima
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Reativar junto com o job build-mobile acima.
      # - name: Baixa o APK do app Android buildado no job anterior
      #   uses: actions/download-artifact@v4
      #   with:
      #     name: organizador-apk
      #     path: /tmp/apk

      # - name: Coloca o APK nos assets estáticos do frontend (baixável em /downloads/organizador.apk)
      #   run: |
      #     mkdir -p frontend/public/downloads
      #     cp /tmp/apk/app-debug.apk frontend/public/downloads/organizador.apk

      - name: Empacota backend + frontend + configs de deploy
        run: |
          tar -czf deploy.tar.gz \
            --exclude=backend/bin --exclude=backend/obj \
            --exclude=frontend/node_modules --exclude=frontend/dist --exclude=frontend/.angular \
            --exclude=deployer/*/bin --exclude=deployer/*/obj \
            --exclude='cerebro/*/*/bin' --exclude='cerebro/*/*/obj' \
            --exclude='ops/*/*/bin' --exclude='ops/*/*/obj' \
            backend frontend deployer cerebro ops docker-compose.yml docker-compose.vps.yml caddy

      - name: Envia pacote para a VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: deploy.tar.gz
          target: /opt/notas-vps
          overwrite: true

      - name: Extrai e sobe os containers (build sequencial, mitigando OOM em 1.9 GiB de RAM)
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            cd /opt/notas-vps
            # tar -xzf só sobrepõe: arquivo removido/renomeado num deploy anterior
            # sobrevive no disco e volta pro contexto de build do Docker (foi assim que
            # kanban/tasks-kanban.page.ts órfão quebrou o build do frontend depois do
            # rename pra projects/project-board.page.ts). Limpa antes de extrair.
            rm -rf backend frontend caddy deployer cerebro ops
            tar -xzf deploy.tar.gz
            rm deploy.tar.gz
            mkdir -p data/db data/sites
            docker stop hermes || true
            docker compose -f docker-compose.yml -f docker-compose.vps.yml build api
            docker compose -f docker-compose.yml -f docker-compose.vps.yml build caddy
            # Ferramenta "Publicar": só builda o deployer onde ele está ligado (.env).
            if grep -q '^COMPOSE_PROFILES=.*publicar' .env 2>/dev/null; then
              docker compose -f docker-compose.yml -f docker-compose.vps.yml build deployer
            fi
            # Ferramenta "Segundo Cérebro": idem, só com o profile "cerebro" ligado.
            if grep -q '^COMPOSE_PROFILES=.*cerebro' .env 2>/dev/null; then
              # Os containers rodam como CEREBRO_PUID:CEREBRO_PGID (padrão 1000): a pasta precisa ser deles.
              uid=$(grep -oP '^CEREBRO_PUID=\K[0-9]+' .env || echo 1000)
              gid=$(grep -oP '^CEREBRO_PGID=\K[0-9]+' .env || echo 1000)
              mkdir -p data/cerebro/webdav data/cerebro/hub/access
              chown -R "$uid:$gid" data/cerebro
              docker compose -f docker-compose.yml -f docker-compose.vps.yml build cerebro
            fi
            # MCP de operação da VPS: só com o profile "ops" ligado.
            if grep -q '^COMPOSE_PROFILES=.*ops' .env 2>/dev/null; then
              mkdir -p data/ops
              docker compose -f docker-compose.yml -f docker-compose.vps.yml build ops
            fi
            export APP_VERSAO=${{ github.sha }}
            docker compose -f docker-compose.yml -f docker-compose.vps.yml up -d
            docker start hermes || true
            docker image prune -f

      - name: Verifica saúde da API
        run: |
          sleep 5
          corpo=$(curl -sf http://${{ secrets.VPS_HOST }}:8090/api/health)
          echo "$corpo"
          # Confirma que o container em pé é o desta execução, e não um que
          # sobreviveu ao "up -d" — um deploy verde não prova substituição.
          echo "$corpo" | grep -q '"versao":"${{ github.sha }}"' || {
            echo "::error::A API respondeu, mas não é a build deste commit (${{ github.sha }})."
            exit 1
          }
          # Sem ICU o container sobe e responde /api/health normalmente, mas
          # qualquer endpoint que formate em pt-BR devolve 500 — foi assim que
          # o dashboard de finanças quebrou sem o deploy acusar nada.
          echo "$corpo" | grep -q '"icu":"ok"' || {
            echo "::error::A imagem subiu sem ICU (modo globalization-invariant)."
            exit 1
          }
