name: Desktop (Windows)

# Monta o instalador do Estúdio pra Windows: o Angular compilado, os craft apps (build web
# publicado pelo workflow "Craft apps"), o ffmpeg, os modelos de IA e a API rodando dentro do
# programa, num Setup.exe do Velopack.
# Depois grava na VPS, em /downloads/windows: é de lá que o botão "Baixar para
# Windows" do site baixa e de onde o programa instalado se atualiza. A tag
# desktop-v1.2.3 também publica uma Release no GitHub.

on:
  push:
    tags: ['desktop-v*']
  workflow_dispatch:
    inputs:
      versao:
        description: 'Versão (ex.: 1.0.0)'
        required: true
        default: '1.0.0'

permissions:
  contents: write

env:
  BIREFNET_URL: https://github.com/danielgatis/rembg/releases/download/v0.0.0/BiRefNet-general-bb_swin_v1_tiny-epoch_232.onnx
  # Build "essentials" do gyan.dev (GPL, espelho no GitHub): ffmpeg.exe e ffprobe.exe para montagem de vídeo,
  # quadros, troca de fundo e miniaturas no Estúdio.
  FFMPEG_URL: https://github.com/GyanD/codexffmpeg/releases/download/8.0/ffmpeg-8.0-essentials_build.zip
  CRAFTS_URL: https://cerebro.vsitefy.com.br/downloads/crafts-web/crafts-web.tar.gz
  CRAFTS_CLI_URL: https://cerebro.vsitefy.com.br/downloads/crafts-web/crafts-cli-win.tar.gz
  ESRGAN_URL: https://qaihub-public-assets.s3.us-west-2.amazonaws.com/qai-hub-models/models/real_esrgan_x4plus/releases/v0.63.0/real_esrgan_x4plus-onnx-float.zip

jobs:
  instalador:
    runs-on: windows-latest
    outputs:
      versao: ${{ steps.v.outputs.versao }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Versão
        id: v
        run: |
          if [[ "$GITHUB_REF" == refs/tags/desktop-v* ]]; then v="${GITHUB_REF#refs/tags/desktop-v}"; else v="${{ inputs.versao }}"; fi
          echo "versao=$v" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Angular
        working-directory: frontend
        run: |
          npm ci
          npx ng build --configuration production
          mkdir -p ../desktop/src/EditorImagens.Desktop/wwwroot
          cp -r dist/frontend/browser/. ../desktop/src/EditorImagens.Desktop/wwwroot/

      - name: Cache dos modelos
        id: cache-modelos
        uses: actions/cache@v4
        with:
          path: desktop/src/EditorImagens.Desktop/modelos
          key: modelos-${{ hashFiles('.github/workflows/desktop.yml') }}
      - name: Modelos de IA (BiRefNet, Real-ESRGAN)
        if: steps.cache-modelos.outputs.cache-hit != 'true'
        run: |
          d=desktop/src/EditorImagens.Desktop/modelos
          mkdir -p "$d" tmp-esrgan
          curl -fsSL "$BIREFNET_URL" -o "$d/birefnet.onnx"
          curl -fsSL "$ESRGAN_URL" -o esrgan.zip
          7z x esrgan.zip -otmp-esrgan > /dev/null
          find tmp-esrgan -name 'real_esrgan_x4plus.onnx' -exec cp {} "$d/" \;
          find tmp-esrgan -name 'real_esrgan_x4plus.data' -exec cp {} "$d/" \;
          ls -la "$d"
          test -s "$d/birefnet.onnx" && test -s "$d/real_esrgan_x4plus.onnx" && test -s "$d/real_esrgan_x4plus.data"

      - name: Craft apps (build web)
        run: |
          d=desktop/src/EditorImagens.Desktop/wwwroot
          if curl -fsSL "$CRAFTS_URL" -o crafts-web.tar.gz; then
            tar -xzf crafts-web.tar.gz -C "$d"
            ls "$d/crafts"
          else
            echo "::warning::Sem os craft apps publicados ($CRAFTS_URL): rode o workflow \"Craft apps\" antes. O instalador sai sem eles."
          fi
          # Linhas de comando dos apps (o MCP de cada craft app roda no PC).
          p=desktop/src/EditorImagens.Desktop
          if curl -fsSL "$CRAFTS_CLI_URL" -o crafts-cli-win.tar.gz; then
            rm -rf "$p/crafts-cli" && tar -xzf crafts-cli-win.tar.gz -C "$p" && mv "$p/crafts-cli-win" "$p/crafts-cli"
            ls "$p/crafts-cli"
          else
            echo "::warning::Sem as CLIs de Windows dos craft apps ($CRAFTS_CLI_URL): o instalador sai sem o MCP dos crafts."
          fi

      - name: Cache do ffmpeg
        id: cache-ffmpeg
        uses: actions/cache@v4
        with:
          path: desktop/src/EditorImagens.Desktop/ffmpeg
          key: ffmpeg-${{ env.FFMPEG_URL }}
      - name: ffmpeg
        if: steps.cache-ffmpeg.outputs.cache-hit != 'true'
        run: |
          d=desktop/src/EditorImagens.Desktop/ffmpeg
          mkdir -p "$d" tmp-ffmpeg
          curl -fsSL "$FFMPEG_URL" -o ffmpeg.zip
          7z x ffmpeg.zip -otmp-ffmpeg > /dev/null
          find tmp-ffmpeg -name 'ffmpeg.exe' -exec cp {} "$d/" \;
          find tmp-ffmpeg -name 'ffprobe.exe' -exec cp {} "$d/" \;
          find tmp-ffmpeg -name 'LICENSE*' -exec cp {} "$d/" \;
          test -s "$d/ffmpeg.exe" && test -s "$d/ffprobe.exe"
          ls -la "$d"

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x
      - name: Testes (IA com os modelos de verdade, formato .edimg)
        run: dotnet test desktop/tests/EditorImagens.Ia.Tests --configuration Release
        env:
          EDITOR_MODELOS: ${{ github.workspace }}/desktop/src/EditorImagens.Desktop/modelos
      - name: Publicar
        run: dotnet publish desktop/src/EditorImagens.Desktop -c Release -r win-x64 --self-contained -p:Version=${{ steps.v.outputs.versao }} -p:UpdateUrl=https://cerebro.vsitefy.com.br/downloads/windows -o publish
      - name: Instalador (Velopack)
        run: |
          dotnet tool install -g vpk --version 1.2.158
          vpk pack --packId EditorImagens --packVersion ${{ steps.v.outputs.versao }} --packDir publish \
            --mainExe EditorImagens.exe --packTitle "Estúdio" --packAuthors "Estúdio" \
            --icon desktop/src/EditorImagens.Desktop/icone.ico --framework webview2 --outputDir Releases

      - uses: actions/upload-artifact@v4
        with:
          name: EditorImagens-${{ steps.v.outputs.versao }}
          path: Releases/
      - name: Release
        if: startsWith(github.ref, 'refs/tags/desktop-v')
        uses: softprops/action-gh-release@v2
        with:
          name: Estúdio ${{ steps.v.outputs.versao }} (Windows)
          files: Releases/*

  # Os actions de SSH/SCP rodam em container: só em runner Linux.
  servidor:
    needs: instalador
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: EditorImagens-${{ needs.instalador.outputs.versao }}
          path: Releases
      - name: Monta a pasta do site
        run: |
          mkdir -p windows
          cp Releases/*-Setup.exe windows/EditorImagens-Setup.exe
          # feed de atualização do Velopack (o programa lê releases.win.json)
          cp Releases/releases.win.json Releases/*-full.nupkg windows/
          if [ -f Releases/RELEASES ]; then cp Releases/RELEASES windows/; fi
          tamanho=$(stat -c %s windows/EditorImagens-Setup.exe)
          printf '{"versao":"%s","arquivo":"EditorImagens-Setup.exe","tamanho":%s,"publicadoEm":"%s"}\n' \
            "${{ needs.instalador.outputs.versao }}" "$tamanho" "$(date -u +%FT%TZ)" > windows/versao.json
          ls -la windows
      - name: Prepara a pasta na VPS
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: rm -rf /opt/notas-vps/downloads/novo && mkdir -p /opt/notas-vps/downloads/novo
      - name: Envia o instalador
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: windows
          target: /opt/notas-vps/downloads/novo
      - name: Troca a versão publicada
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          # troca a pasta inteira de uma vez: ninguém baixa meio instalador; só a
          # última versão fica no disco
          script: |
            set -e
            cd /opt/notas-vps/downloads
            rm -rf antigo
            if [ -d windows ]; then mv windows antigo; fi
            mv novo/windows windows
            rm -rf novo antigo
      - name: Confere o link
        run: |
          curl -sf https://cerebro.vsitefy.com.br/downloads/windows/versao.json | grep -q '"versao":"${{ needs.instalador.outputs.versao }}"' || {
            echo "::error::O site não está servindo /downloads/windows (o container do Caddy precisa do volume ./downloads — faça um deploy da main)."
            exit 1
          }
