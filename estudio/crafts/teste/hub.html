<!DOCTYPE html><html><body>
<iframe id="f" src="/crafts/fakecraft/index.html?host=parent" style="width:800px;height:600px"></iframe>
<script>
  window.msgs = [];
  window.addEventListener('message', (e) => {
    if (e.source !== document.getElementById('f').contentWindow) return;
    const d = e.data; const c = { type: d.type };
    if (d.bytes) c.texto = new TextDecoder().decode(d.bytes);
    if (d.name) c.name = d.name; if ('dirty' in d) c.dirty = d.dirty; if (d.ponte) c.ponte = d.ponte;
    window.msgs.push(c);
    if (d.type === 'fakecraft:ready') {
      const bytes = new TextEncoder().encode('ola mundo').buffer;
      e.source.postMessage({ type: 'fakecraft:open', name: 'nota.txt', bytes, modo: 'inserir' }, location.origin, [bytes]);
    }
  });
</script></body></html>
