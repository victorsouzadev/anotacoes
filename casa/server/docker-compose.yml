# HTTPS pelo nginx-proxy-manager: casa.vsitefy.com.br → casa-api:8080 (rede "proxy").
services:
  casa:
    build: .
    container_name: casa-api
    restart: unless-stopped
    env_file: .env   # UPLOAD_TOKEN: publicar o APK (PUT /admin/apk) e ler logs (GET /admin/logs)
    volumes:
      - casa-data:/data
    networks:
      - proxy
    mem_limit: 96m
    # Linhas de requisição no stdout: no máximo 3 × 10 MB.
    logging:
      driver: json-file
      options: { max-size: 10m, max-file: "3" }
volumes:
  casa-data:
networks:
  proxy:
    external: true
