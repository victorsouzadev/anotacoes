# HTTPS pelo nginx-proxy-manager: casa.vsitefy.com.br → casa-api:8080 (rede "proxy").
services:
  casa:
    build: .
    container_name: casa-api
    restart: unless-stopped
    volumes:
      - casa-data:/data
    networks:
      - proxy
    mem_limit: 96m
volumes:
  casa-data:
networks:
  proxy:
    external: true
